# Optional: deploys the online-rooms server (Cloudflare Worker) when server/engine code changes.
# Cloudflare auto-deploy is already set up on the owner's account, so this stays manual to avoid double deploys. To use it instead:
#   1. Create a Cloudflare API token (template "Edit Cloudflare Workers") and add it to the repo secrets as CLOUDFLARE_API_TOKEN,
#      plus CLOUDFLARE_ACCOUNT_ID.
#   2. Change `on:` below to also run on push (see the commented block), or run it manually from the Actions tab.
name: Deploy Worker
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['party/**', 'src/engine/**', 'src/net/protocol.ts', 'wrangler.jsonc', 'package.json']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
